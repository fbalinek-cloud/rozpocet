<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rozpočet Balínkovi</title>
<meta name="description" content="Společný rodinný rozpočet, šifrovaný přímo v telefonu.">
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rozpočet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: jedna úzká sloupcová aplikace, nahoře měsíc, dole pevná navigace s pěti záložkami, plovoucí „+“; podsekce přes vodorovné čipy */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E3E9E7; --ink:#13201D; --muted:#5C6B67; --line:#D5DDDA;
  --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#D3EAE3;
  --out:#C2410C; --in:#0E7A4F; --warn:#B7791F; --warn-soft:#F6EAD3; --over:#C2362B; --over-soft:#F7DEDA;
  --shadow:0 10px 30px -12px rgba(19,32,29,.25);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --surface-2:#222E2A; --ink:#E6EEEB; --muted:#93A39E; --line:#2C3A36;
  --accent:#4FC3A1; --accent-ink:#06221A; --accent-soft:#1D3A32;
  --out:#F0875A; --in:#5BD39A; --warn:#E3B04B; --warn-soft:#3A2F17; --over:#F07167; --over-soft:#3D1F1C;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --surface-2:#222E2A; --ink:#E6EEEB; --muted:#93A39E; --line:#2C3A36;
  --accent:#4FC3A1; --accent-ink:#06221A; --accent-soft:#1D3A32;
  --out:#F0875A; --in:#5BD39A; --warn:#E3B04B; --warn-soft:#3A2F17; --over:#F07167; --over-soft:#3D1F1C;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:0 130px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px}
header.top .in{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:grid;line-height:1.15}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted)}
.month{display:flex;align-items:center;gap:4px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.month span{min-width:112px;text-align:center;font-weight:600}

.subnav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin-bottom:2px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.86rem;font-weight:500}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-block:4px 12px}
.banner button{border:0;background:transparent;font-weight:600;color:var(--accent);padding:4px;white-space:nowrap}

.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:20px;display:grid;gap:14px}
.hero .lab{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:-.03em}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .row.three{grid-template-columns:repeat(3,1fr)}
.hero .row div{display:grid;gap:2px;min-width:0}
.hero .row b{font-family:var(--f-display);font-size:1.12rem;font-weight:600}
.hero small{opacity:.75;font-size:.8rem}
.hero .perday{background:rgba(127,127,127,.18);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .perday b{font-family:var(--f-display);font-size:1.3rem}

section.card{background:var(--surface);border-radius:18px;padding:16px;margin-top:14px;border:1px solid var(--line)}
section.card:first-child{margin-top:4px}
h2{font-family:var(--f-display);font-size:1.05rem;font-weight:600;margin:0 0 12px;text-wrap:balance;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.p:last-child{margin-bottom:0}

.alerts{display:grid;gap:8px;margin-top:14px}
.alert{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.alert .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.alert.over .ico{background:var(--over-soft);color:var(--over)}
.alert.warn .ico{background:var(--warn-soft);color:var(--warn)}
.alert.info .ico{background:var(--accent-soft);color:var(--accent)}
.alert b{display:block}
.alert span{color:var(--muted)}
button.lnk{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0;margin-top:2px}

.feed{background:var(--accent-soft);border-radius:18px;padding:14px 16px;margin-top:4px}
.feed h2{margin-bottom:8px}
.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.feed li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.feed li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .btn{margin-top:10px}

.cats{display:grid;gap:12px}
.cat{display:grid;gap:5px}
.cat .t{display:flex;justify-content:space-between;gap:8px;font-size:.93rem}
.cat .t span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.cat .lim{font-size:.78rem;color:var(--muted)}
.cat.warn .lim{color:var(--warn)} .cat.over .lim{color:var(--over);font-weight:600}

.donut{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut svg{width:150px;height:150px;max-width:100%}
.donut .lg{display:grid;gap:6px;font-size:.85rem;min-width:0}
.donut .lg div{display:flex;justify-content:space-between;gap:8px}
.donut .lg span:first-child{display:flex;gap:7px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:380px){.donut{grid-template-columns:1fr;justify-items:center}.donut .lg{width:100%}}
.chart-ink{fill:var(--ink)} .chart-muted{fill:var(--muted)}
.grid-l{stroke:var(--line)}

.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:.85rem}
.legend span{display:flex;align-items:center;gap:6px}

.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.trend .col{display:grid;grid-template-rows:110px auto auto;gap:4px}
.trend .bars{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:110px}
.trend .bars i{width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.trend .m{font-size:.72rem;color:var(--muted);text-align:center}
.trend .net{font-size:.68rem;text-align:center;font-weight:600}
.trend .col.cur .m{color:var(--ink);font-weight:700}

.list{display:grid;gap:4px}
.day{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 4px;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.tx .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:#fff}
.tx .mid{min-width:0}
.tx .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{color:var(--muted);font-size:.8rem;display:block}
.tx .mid em{font-style:normal;font-size:.8rem;color:var(--ink);opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-family:var(--f-display);font-weight:600;font-size:1.02rem;white-space:nowrap;text-align:right}
.tx .amt small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted)}
.amt.o{color:var(--ink)} .amt.i{color:var(--in)} .amt.s{color:var(--muted)}
.new-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.tag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:4px}

.filters{display:grid;gap:10px;margin-top:4px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frow select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;width:100%;min-width:0}
.sum-line{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);padding:8px 4px 0;gap:8px}

.empty{text-align:center;padding:36px 16px;display:grid;gap:12px;justify-items:center}
.empty h3{font-family:var(--f-display);font-size:1.3rem;margin:0}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--over)}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:.86rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1}

.goal{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.goal .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.goal .t b{font-family:var(--f-display);font-size:1.05rem}
.goal .hint{font-size:.83rem;color:var(--muted)}
.goal .hint.warn{color:var(--warn)}
.goal .acts{display:flex;gap:8px}
.goal .acts button{flex:1;padding:9px;font-size:.88rem}

.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.93rem}
.kv div:first-child{border-top:0}
.kv div.total{font-weight:700;font-family:var(--f-display);font-size:1.05rem;border-top:2px solid var(--ink)}
.kv span:first-child{display:flex;gap:8px;align-items:center;min-width:0}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0}
.tile small{color:var(--muted);font-size:.74rem}
.tile b{font-family:var(--f-display);font-size:1.05rem}
@media (max-width:360px){.tiles{grid-template-columns:1fr 1fr}}

.story{display:grid;gap:10px}
.story p{margin:0;font-size:.95rem}
.story b{font-family:var(--f-display)}

.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.limrow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.limrow:first-of-type{border-top:0}
.limrow span{display:flex;gap:8px;align-items:center;min-width:0}
.limrow input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:right;width:100%}
.limrow small{display:block;color:var(--muted);font-size:.74rem}
.checkrow{display:flex;gap:10px;align-items:center;margin:-4px 0 14px;font-size:.92rem}
.checkrow input{width:20px;height:20px;accent-color:var(--accent)}

.imp{display:grid;gap:6px;max-height:340px;overflow-y:auto;margin:10px 0}
.imp label{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.88rem}
.imp label small{display:block;color:var(--muted);font-size:.76rem}
.imp input{width:18px;height:18px;accent-color:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 2px 12px;display:grid;justify-items:center;gap:3px;font-size:.72rem;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--over);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-size:1.25rem;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3 button{border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:14px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount-in{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--accent);margin-bottom:16px;padding-bottom:4px}
.amount-in input{border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:2.4rem;width:100%;min-width:0;outline:none;letter-spacing:-.02em}
.amount-in span{font-family:var(--f-display);font-size:1.2rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.86rem;display:flex;gap:7px;align-items:center}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.sugg button{border:0;background:var(--surface-2);border-radius:99px;padding:5px 10px;font-size:.8rem}
.smart{font-size:.8rem;color:var(--accent);margin:-8px 0 12px;min-height:1em}
.receipt{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:.88rem}
.sheet .foot{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.sheet .foot .btn{flex:1}
.confirm{background:var(--surface);border:1px solid var(--over);border-radius:12px;padding:12px;margin-top:10px;display:grid;gap:10px}
.rc-items{display:grid;gap:6px;margin:10px 0 14px}
.rc-item{display:grid;grid-template-columns:1fr 88px 34px;gap:6px 8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rc-item.learned{border-color:var(--accent)}
.rc-item .nm{grid-column:1/-1;font-size:.9rem;font-weight:500;min-width:0;overflow-wrap:anywhere;display:flex;justify-content:space-between;gap:8px}
.rc-item .nm small{color:var(--accent);font-weight:600;font-size:.72rem;white-space:nowrap}
.rc-item select,.rc-item input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 8px;min-width:0;width:100%;font-size:.86rem}
.rc-item input{text-align:right}
.rc-item button{border:0;background:var(--surface-2);border-radius:8px;height:34px}
.rc-sum{display:grid;gap:4px;margin-top:8px}
.rc-sum div{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.rc-sum span:first-child{display:flex;gap:7px;align-items:center}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.9rem}
.whoami{display:grid;gap:10px}
.whoami .btn{padding:16px;font-size:1.05rem}

.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.lock .box{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.lock h1{font-family:var(--f-display);font-size:1.6rem;margin:0}
.lock input{font-family:var(--f-display);font-size:2rem;text-align:center;letter-spacing:.4em;border:0;border-bottom:2px solid var(--accent);background:transparent;padding:8px;width:100%;outline:none}
.lock .err{color:var(--over);font-weight:600;min-height:1.3em;font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.mt{margin-top:10px}

/* ================= šifrování (AES-GCM, klíč z PINu přes PBKDF2) ================= */
const TE=new TextEncoder(), TD=new TextDecoder();
const b64 = buf => { const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pin,salt){ const base=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function encObj(key,obj){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj))); return {iv:b64(iv),ct:b64(ct)}; }
async function decObj(key,o){ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct)); return JSON.parse(TD.decode(pt)); }

function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('rozpocet',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbClear(){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').clear(); t.oncomplete=res; t.onerror=res; }); }catch(e){} }

async function deriveHH(password,saltB64){ // 512 bitů: prvních 256 = šifrovací klíč (zůstává v telefonu), dalších 256 = přístupový token
  const base=await crypto.subtle.importKey('raw',TE.encode(password.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub64(saltB64),iterations:310000,hash:'SHA-256'},base,512));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-GCM'},false,['encrypt','decrypt']);
  const token=[...bits.slice(32)].map(x=>x.toString(16).padStart(2,'0')).join('');
  return {key,token};
}

async function persist(){ if(!S.key||S.demo) return; try{ const e=await encObj(S.key,{D:S.D,synced,lastSync}); ls.set('rb3-cache',JSON.stringify(e)); }catch(e){} }
async function loadCache(){ try{ const raw=ls.get('rb3-cache'); if(!raw) return false; const o=await decObj(S.key,JSON.parse(raw)); S.D=normalizeD(o.D); synced=o.synced||{}; lastSync=o.lastSync||null; return true; }catch(e){ return false; } }

function snapshot(){ const out={}; KINDS.forEach(k=>S.D[k].forEach(o=>{ if(o&&o.id) out[k+'|'+o.id]=o; })); METAS.forEach(m=>out['meta|'+m]=S.D[m]); return out; }
function queueDiff(){ const cur=snapshot();
  for(const key in cur){ const j=JSON.stringify(cur[key]); if(synced[key]!==j) pendingQ.set(key,{j,o:cur[key]}); else pendingQ.delete(key); }
  for(const key in synced){ if(!(key in cur)) pendingQ.set(key,{del:true}); }
  S.sync.pending=pendingQ.size; }
async function flush(){
  if(pushing||!sb||!S.hh||!pendingQ.size) return; pushing=true; let again=false;
  try{
    const entries=[...pendingQ.entries()].slice(0,200);
    const rows=await Promise.all(entries.map(async([key,v])=>{ const i=key.indexOf('|'), kind=key.slice(0,i), id=key.slice(i+1);
      if(v.del) return {household_id:S.hh.id,kind,id,iv:null,ct:null,deleted:true};
      const e=await encObj(S.key,v.o); return {household_id:S.hh.id,kind,id,iv:e.iv,ct:e.ct,deleted:false}; }));
    const {error}=await sb.from('records').upsert(rows,{onConflict:'household_id,kind,id'});
    if(error) throw error;
    entries.forEach(([key,v])=>{ if(pendingQ.get(key)===v){ pendingQ.delete(key); if(v.del) delete synced[key]; else synced[key]=v.j; } });
    S.sync.state='ok'; S.sync.err=''; S.sync.last=Date.now(); again=pendingQ.size>0;
  }catch(e){ S.sync.state=navigator.onLine===false?'offline':'error'; S.sync.err=(e&&e.message)||''; }
  finally{ pushing=false; S.sync.pending=pendingQ.size; await persist(); renderStatus(); if(again) setTimeout(flush,50); }
}
async function applyRow(r){
  const key=r.kind+'|'+r.id; if(pendingQ.has(key)) return false; // neodeslaná změna v tomhle telefonu má přednost
  if(r.kind==='meta'){ if(r.deleted||!METAS.includes(r.id)) return false; const o=await decObj(S.key,{iv:r.iv,ct:r.ct}); const j=JSON.stringify(o); if(synced[key]===j) return false; S.D[r.id]=o; if(r.id==='settings') normalizeD(S.D); synced[key]=JSON.stringify(S.D[r.id]); return {o}; }
  if(!KINDS.includes(r.kind)) return false;
  const arr=S.D[r.kind], i=arr.findIndex(x=>x.id===r.id);
  if(r.deleted){ delete synced[key]; if(i>=0){ arr.splice(i,1); return {del:true}; } return false; }
  const o=await decObj(S.key,{iv:r.iv,ct:r.ct}); const j=JSON.stringify(o); if(synced[key]===j&&i>=0) return false;
  if(i>=0) arr[i]=o; else arr.push(o); synced[key]=j; return {o};
}
async function pull(){
  let from=lastSync, changed=false;
  for(let guard=0;guard<100;guard++){
    let q=sb.from('records').select('kind,id,iv,ct,deleted,updated_at,updated_by').eq('household_id',S.hh.id).order('updated_at',{ascending:true}).limit(1000);
    if(from) q=q.gt('updated_at',from);
    const {data,error}=await q; if(error) throw error;
    for(const r of data){ try{ if(await applyRow(r)) changed=true; }catch(e){} from=r.updated_at; }
    if(data.length<1000) break;
  }
  lastSync=from; return changed;
}
function subscribe(){
  if(!sb||!S.hh) return; if(channel){ try{ sb.removeChannel(channel); }catch(e){} }
  channel=sb.channel('rb-'+S.hh.id).on('postgres_changes',{event:'*',schema:'public',table:'records',filter:'household_id=eq.'+S.hh.id},async p=>{
    const r=p.new; if(!r||!r.kind) return;
    try{ const res=await applyRow(r); if(r.updated_at&&(!lastSync||r.updated_at>lastSync)) lastSync=r.updated_at; if(!res) return;
      if(res.o&&r.kind==='tx'&&r.updated_by!==S.uid) notifyIncoming(res.o);
      await persist(); render(); }catch(e){} })
    .subscribe(st=>{ S.sync.live=st==='SUBSCRIBED'; renderStatus(); });
}
function notifyIncoming(o){ const N=names(); if(!o.by||o.by===S.me||!N[o.by]) return; const ed=(o.changedAt||0)>(o.createdAt||0)+2000;
  const what=o.type==='prevod'?`převod ${kc(o.amount)}`:`${o.note||(CAT[o.cat]||{}).n||''} ${o.type==='prijem'?'+':'−'}${kc(o.amount)}`;
  toast(`${N[o.by]} ${ed?'upravil':'zapsal'}${fem(N[o.by])?'a':''}: ${what}`); }
async function ensureSession(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session){ const {data,error}=await sb.auth.signInAnonymously(); if(error) throw error; session=data.session;
    if(S.hh&&S.token){ const {error:e2}=await sb.rpc('join_household',{p_code:S.hh.code,p_token:S.token}); if(e2) throw e2; } }

async function syncNow(){

  return t; }

const fixedSorted = () => [...D().fixed].sort((a,b)=>(a.order??999)-(b.order??999) || String(a.name).localeCompare(b.name,'cs'));
const fixTxId = (k,f) => 'fx-'+k+'-'+f.id;
const fixDone = (k,f) => D().tx.some(t=>t.fixedId===f.id && mkey(t.date)===k);
const fixedTotal = () => D().fixed.reduce((a,f)=>a+(+f.amount||0),0);
const dueDate = (k,f) => k+'-'+pad(Math.min(+f.day,daysIn(k)));
function dueList(){ const k=mkey(today()); return fixedSorted().filter(f=>f.day && !fixDone(k,f)).map(f=>({f,date:dueDate(k,f),d:daysUntil(dueDate(k,f))})).filter(x=>x.d<=3).sort((a,b)=>a.d-b.d); }
const dueLabel = d => d<0 ? `${-d} ${pl(-d,'den','dny','dní')} po splatnosti` : d===0 ? 'dnes' : d===1 ? 'zítra' : `za ${d} dny`;
const isTx = t => t.type==='prijem'||t.type==='vydaj';

function monthStats(k){
  const list = D().tx.filter(t=>mkey(t.date)===k && isTx(t));
  let inc=0, out=0, fixedOut=0; const byCat={}, byWho={a:0,b:0,spol:0};
  list.forEach(t=>{ if(t.type==='prijem') inc+=t.amount; else { out+=t.amount; if(t.fixedId) fixedOut+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount; byWho[t.who]=(byWho[t.who]||0)+t.amount; } });
  return {list,inc,out,fixedOut,varOut:out-fixedOut,byCat,byWho};
}
function avgMonths(n){ let inc=0,out=0,c=0; for(let i=1;i<=n;i++){ const st=monthStats(shiftM(mkey(today()),-i)); if(st.inc||st.out){inc+=st.inc;out+=st.out;c++;} } return c?{inc:inc/c,out:out/c,n:c}:{inc:0,out:0,n:0}; }
function cumulative(k){
  const n=daysIn(k), arr=new Array(n).fill(0);
  D().tx.forEach(t=>{ if(t.type==='vydaj' && mkey(t.date)===k){ const d=+t.date.slice(8,10); if(d>=1&&d<=n) arr[d-1]+=t.amount; } });
  for(let i=1;i<n;i++) arr[i]+=arr[i-1];
  return arr;
}
function newsItems(){ const o=other(); if(!o) return []; return D().tx.filter(t=>t.by===o && (t.changedAt||t.createdAt||0)>(D().lastSeen||0)).sort((a,b)=>(b.changedAt||0)-(a.changedAt||0)); }
function settlement(){ // >0: B dluží A
  let owed=0; D().tx.forEach(t=>{
    if(t.type==='vydaj' && t.shared && (t.who==='a'||t.who==='b')) owed += (t.who==='a'?1:-1)*t.amount/2;
    if(t.type==='vyrovnani') owed += (t.from==='b'?-1:1)*t.amount;
  }); return Math.round(owed);
}
const sinkNeed = s => { const left=Math.max(1,monthsBetween(mkey(today()),s.due)); return Math.max(0,(s.amount-(s.saved||0)))/left; };
const goalNeed = g => { if(!g.deadline||g.saved>=g.target) return 0; const left=monthsBetween(mkey(today()),g.deadline); return left>0?(g.target-g.saved)/left:0; };
function accBalanceAt(a,date){
  const hs=(a.history||[]).filter(h=>h.d<=date); const anc=hs[hs.length-1]; if(!anc) return null; if(a.kind==='dluh') return anc.v;
  let v=anc.v; D().tx.forEach(t=>{ if(t.date<=anc.d||t.date>date) return;
    if(t.type==='prevod'){ if(t.to===a.id) v+=t.amount; if(t.from===a.id) v-=t.amount; }
    else if(t.account===a.id && (t.type==='prijem'||t.type==='vydaj')) v+=(t.type==='prijem'?1:-1)*t.amount; });
  return Math.round(v*100)/100;
}
const accVal = a => accBalanceAt(a,today())??0;
const accName = id => (D().accounts.find(a=>a.id===id)||{name:'?'}).name;

function condStatus(a,k){
  const c=a.cond; if(!c||!c.min) return null; const src=D().accounts.find(x=>x.id===c.account); if(!src) return null;
  const ids=new Set(); D().tx.forEach(t=>{ if(mkey(t.date)!==k) return; if(t.type==='vydaj'&&t.account===src.id) ids.add(t.receiptId||t.id); else if(c.transfers&&t.type==='prevod'&&t.from===src.id) ids.add(t.id); });

function guessCat(note){
  const n=(note||'').toLowerCase().trim(); if(n.length<2) return null;
  // naučené z historie
  const first=n.split(/\s+/)[0]; const cnt={};
  D().tx.forEach(t=>{ if(t.type==='vydaj'&&t.note&&t.note.toLowerCase().split(/\s+/)[0]===first) cnt[t.cat]=(cnt[t.cat]||0)+1; });
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; if(best) return {cat:best[0],why:'podle dřívějších zápisů'};
  for(const [cat,words] of Object.entries(KEYWORDS)) if(words.some(w=>n.includes(w))) return {cat,why:'podle názvu'};

}

const RC_CATS = ['jidlo','drogerie','domacnost','psi','zdravi','obleceni','sport','darky','ostatni'];
const itemKey = n => (n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\d+([.,]\d+)?\s*(g|kg|ml|l|ks|x|%)?/g,' ').replace(/[^a-z ]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,3).join(' ');
const r2 = n => Math.round(n*100)/100;
function receiptTxs(rc){
  const groups={}; rc.items.forEach(it=>{ const g=groups[it.cat]=groups[it.cat]||{amt:0,names:[]}; g.amt+=+it.price||0; g.names.push(it.name); });
  const sum=Object.values(groups).reduce((a,g)=>a+g.amt,0), total=rc.total>0?rc.total:sum, diff=r2(total-sum);
  const keys=Object.keys(groups); if(Math.abs(diff)>=0.01 && keys.length){ keys.sort((a,b)=>groups[b].amt-groups[a].amt); groups[keys[0]].amt+=diff; }
  const now=Date.now();
  return Object.entries(groups).map(([cat,g])=>({id:'rc-'+rc.id+'-'+cat,date:rc.date,amount:r2(g.amt),type:'vydaj',cat,who:rc.who||'spol',note:rc.store||'Účtenka',receiptId:rc.id,account:rc.account||null,items:g.names,shared:!!rc.shared,createdAt:rc.createdAt||now,changedAt:now,by:rc.by||null})).filter(t=>t.amount>0);
}
function saveReceipt(rc){ D().tx=D().tx.filter(t=>t.receiptId!==rc.id); receiptTxs(rc).forEach(t=>D().tx.push(t)); upsert('receipts',rc); }
const RC_PROMPT = `Jsi pomocník na rozúčtování české účtenky z obchodu (Kaufland, Lidl, Albert, Billa, DM, Rossmann a další). Přečti všechny položky na fotkách. U dlouhé účtenky může být víc fotek, které na sebe navazují: položky nezdvojuj.

const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  ['ostatni',['zaloh','vratn','taska','igelit']],
  ['zdravi',['vitamin','paralen','ibalgin','ibuprof','panadol','nurofen','naplast','magnez','acylpyrin','strepsils']],

function guessItemCat(name){
  const k=itemKey(name), learned=(D().itemCats||{})[k]; if(learned) return {cat:learned,learned:true};
  const n=norm(name), toks=n.split(/[^a-z]+/).filter(Boolean);
  for(const [cat,stems] of ITEM_DICT) for(const st of stems){ if(st.includes(' ')){ if(n.includes(st)) return {cat}; } else if(toks.some(t=>t.startsWith(st))) return {cat}; }
  return {cat:'jidlo',unsure:true};
}
const STORES=['lidl','kaufland','albert','billa','tesco','penny','globus','rossmann','teta','makro','norma','coop','hruska','dm drogerie'];
function parseReceiptText(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const PRICE=/(-?\d{1,3}(?:[ .]\d{3})*[.,]\d{2}|-?\d{1,5}[.,]\d{2})\s*-?\s*(?:[A-Z]{1,2}|Kč|CZK)?\s*$/i;
  const SKIP=/^(mezisou|subtotal|platba|platebn|karta|kartou|hotov|vraceno|vráceno|dph|sazba|základ|zaklad|eet|bkp|fik|dič|ičo|ic:|dic|děkuj|dekuj|pokladn|účtenk|uctenk|daňov|danov|doklad|datum|čas|cas |tel|www|provozov|česká rep|ceska rep|visa|master|terminál|terminal|autoriz|transak|stav bod|body|ušetř|usetr|celkem uš|rekapit|zaokrouhl|číslo|cislo|kasa|prodavač|obsluh)/i;
  const TOTAL=/(celkem|k úhrad|k uhrad|k zaplac|suma)/i;
  const DISC=/(sleva|lidl plus|kaufland card|kupon|kupón|bonus|akce -)/i;
  const QTY=/^\d+([.,]\d+)?\s*(ks|kg|x|×)\b/i;
  const val=s=>parseAmt(s.replace(/[ ]/g,'').replace(/\.(?=\d{3}\b)/g,''));
  let store='', date=null, total=null; const inline=[], names=[], prices=[];
  for(const l of lines){
    const nl=norm(l);
    if(!store){ const st=STORES.find(x=>nl.includes(x)); if(st) store=st==='dm drogerie'?'DM drogerie':st.charAt(0).toUpperCase()+st.slice(1); }
    if(!date){ const m=l.match(/(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})/); if(m) date=m[3]+'-'+pad(m[2])+'-'+pad(m[1]); }
    const pm=l.match(PRICE); const before=pm?l.slice(0,pm.index).trim():l; const letters=(before.match(/[a-zá-ž]/gi)||[]).length;
    if(TOTAL.test(l)){ if(pm){ const v=Math.abs(val(pm[1])); if(v>(total||0)) total=v; } continue; }
    if(SKIP.test(l)) continue;
    if(pm && letters>=2 && !QTY.test(before)){
      const v=val(pm[1]); if(!isFinite(v)) continue;
      if(DISC.test(before)||v<0||/-\s*$/.test(l)){ const prev=inline[inline.length-1]; if(prev) prev.price=r2(prev.price-Math.abs(v)); continue; }
      inline.push({name:before,price:v});
    } else if(pm && letters<2){ const v=val(pm[1]); if(isFinite(v)&&!QTY.test(l)) prices.push(v); }
    else if(!pm && letters>=2 && !QTY.test(l)) names.push(l);
  }
  let items=inline;
  if(inline.length<2 && names.length && prices.length){ // Živý text často zkopíruje názvy a ceny ve dvou sloupcích
    const isHeader=n=>{ const x=norm(n).trim(); return STORES.some(st=>x===st||(x.includes(st)&&/s\.?r\.?o|v\.?o\.?s|a\.s\.|ceska|republika|spol/.test(x))); };
    const nm=names.filter(n=>!isHeader(n) && !/^[\d\s.,:/-]+$/.test(n));
    let run=0; const ps=[]; for(const v of prices){ if(ps.length>1 && Math.abs(v-run)<0.6){ total=total||v; break; } ps.push(v); run+=v; }
    items=[]; let pi=0;
    for(const n of nm){ if(pi>=ps.length) break; if(DISC.test(n)){ const prev=items[items.length-1]; if(prev) prev.price=r2(prev.price-Math.abs(ps[pi])); pi++; continue; } items.push({name:n,price:ps[pi++]}); }
  }
  const pretty=n=>{ let t=n.replace(/^\d{3,}\s+/,'').replace(/\s+[A-Z]$/,'').trim(); if(t===t.toUpperCase()) t=t.charAt(0)+t.slice(1).toLowerCase(); return t.slice(0,80); };
  items=items.filter(i=>i.price>0).map(i=>{ const name=pretty(i.name); const g=guessItemCat(name); return {name,price:r2(i.price),cat:g.cat,ai:g.cat,learned:!!g.learned,unsure:!!g.unsure}; });
  const sum=r2(items.reduce((a,i)=>a+i.price,0));
  return {id:uid('r'),store:store||'Účtenka',date:date&&date<=today()?date:today(),total:total||sum,items,who:'spol',by:S.me||null,createdAt:Date.now(),nLearned:items.filter(i=>i.learned).length,nUnsure:items.filter(i=>i.unsure).length};
}

async function readReceiptItems(files){
  const sample=await window.claude.use('sample'); if(!sample) throw {code:'not_granted'};
  const lim=await sample.limits().catch(()=>null); const max=(lim&&lim.images&&lim.images.maxCount)||3;
  const r=await sample.json(RC_PROMPT,{images:[...files].slice(0,max),modelTier:'default'});
  const num=v=>{ const n=typeof v==='number'?v:parseAmt(String(v||'').replace(/[^\d,.\-]/g,'')); return isFinite(n)?n:NaN; };
  const learned=D().itemCats||{}; let nLearned=0;
  const items=(Array.isArray(r&&r.items)?r.items:[]).map(it=>{ const price=num(it.price); if(!it||!it.name||!(price>0)) return null;
    const ai=EXP.some(c=>c.id===it.category)?it.category:'ostatni'; const lc=learned[itemKey(it.name)]; if(lc&&lc!==ai) nLearned++;
    return {name:String(it.name).slice(0,80),price:r2(price),cat:lc||ai,ai,learned:!!lc}; }).filter(Boolean);
  if(!items.length) throw {code:'empty'};
  const sum=r2(items.reduce((a,i)=>a+i.price,0)), total=num(r.total)>0?r2(num(r.total)):sum;
  const date=r.date&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&r.date<=today()?r.date:today();
  return {id:uid('r'),store:String(r.store||'Účtenka').slice(0,40),date,total,items,who:'spol',by:S.me||null,createdAt:Date.now(),nLearned};
}

function alertsFor(){
  const out=[], k=S.month, cur=k===mkey(today()), st=monthStats(k), lim=D().settings.limits||{};
  EXP.forEach(c=>{ const l=+lim[c.id]||0, a=st.byCat[c.id]||0; if(!l) return;
    if(a>l) out.push({lvl:'over',ico:'!',t:`Obálka ${c.n}: přečerpáno o ${kc(a-l)}`,s:`Utraceno ${kc(a)} z ${kc(l)}.`});
    else if(a>=l*.85) out.push({lvl:'warn',ico:'%',t:`Obálka ${c.n}: ${Math.round(a/l*100)} %`,s:`Zbývá ${kc(l-a)} do konce měsíce.`});
  });
  if(cur && st.inc>0){
    const day=new Date().getDate(), proj=fixedTotal()+(day>=5?st.varOut/day*daysIn(k):st.varOut);
    if(day>=5 && proj>st.inc) out.push({lvl:'warn',ico:'↗',t:`Při tomhle tempu utratíte ${kc(proj)}`,s:`To je o ${kc(proj-st.inc)} víc než příjmy za ${mName(k)}.`});
  } else if(cur && !st.inc && new Date().getDate()>=12) out.push({lvl:'info',ico:'+',t:'Chybí příjmy za tento měsíc',s:'Zapiš výplaty, ať sedí zůstatek a denní rozpočet.',act:'addinc'});
  const pend=fixedSorted().filter(f=>!fixDone(k,f) && (!cur||!f.day));
  if(pend.length && (!cur||new Date().getDate()>=3)) out.push({lvl:'info',ico:'≡',t:`Nezapsané fixy: ${pend.length}`,s:`${kc(pend.reduce((a,f)=>a+(+f.amount||0),0))} za ${mName(k)}.`,act:'writefix'});
  // předplatné
  D().fixed.forEach(f=>{ const h=(f.priceHistory||[]).slice(-1)[0]; if(h && h.to>h.from && daysUntil(h.d)>-60) out.push({lvl:'warn',ico:'↑',t:`${f.name} zdražil${fem(f.name)?'a':''} o ${kc(h.to-h.from)}`,s:`Z ${kc(h.from)} na ${kc(h.to)} měsíčně, to je ${kc((h.to-h.from)*12)} ročně navíc.`}); });
  st.list.forEach(t=>{ if(t.type!=='vydaj'||t.fixedId) return; const f=D().fixed.find(f=>f.cat==='predplatne'&&t.note&&t.note.toLowerCase().includes(f.name.toLowerCase())); if(f && t.amount>f.amount) out.push({lvl:'warn',ico:'↑',t:`${f.name}: strženo ${kc(t.amount)}`,s:`Ve fixech máš ${kc(f.amount)}. Zkontroluj, jestli nezdražili.`}); });
  const owed=settlement(), N=names();
  if(Math.abs(owed)>=500) out.push({lvl:'info',ico:'⇄',t:owed>0?`${N.b} dluží ${N.a} ${kc(owed)}`:`${N.a} dluží ${N.b} ${kc(-owed)}`,s:'Za společné výdaje placené ze svého.',act:'settle'});
  D().goals.forEach(g=>{ if(g.deadline&&g.saved<g.target&&monthsBetween(mkey(today()),g.deadline)<=0) out.push({lvl:'over',ico:'◎',t:`Cíl „${g.name}“ měl být hotový`,s:`Chybí ${kc(g.target-g.saved)}.`}); });
  D().sinking.forEach(s=>{ const left=monthsBetween(mkey(today()),s.due); if(left<=1 && (s.saved||0)<s.amount) out.push({lvl:'warn',ico:'⌛',t:`${s.name} ${left<=0?'je splatné':'příští měsíc'}`,s:`Odloženo ${kc(s.saved||0)} z ${kc(s.amount)}.`}); });
  D().accounts.forEach(a=>{ const cs=condStatus(a,k); if(cs&&cs.cur&&!cs.met&&cs.left<=7) out.push({lvl:'warn',ico:'%',t:`${a.name}: chybí ${cs.missing} ${pl(cs.missing,'platba','platby','plateb')} pro úrok ${String(a.rate).replace('.',',')} %`,s:`Zbývá ${cs.left} ${pl(cs.left,'den','dny','dní')}. Zaplať kartou z účtu ${cs.src.name}.`}); });
  const order={over:0,warn:1,info:2}; return out.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}

function donutSvg(rows,total){
  const R=56, C=2*Math.PI*R; let off=0, segs='';
  rows.forEach(r=>{ const len=r.amt/total*C; segs+=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${r.c.c}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${r.c.n}: ${kc(r.amt)}</title></circle>`; off+=len; });
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Výdaje podle kategorií"><circle r="${R}" cx="75" cy="75" fill="none" class="grid-l" stroke-width="22"/>${segs}
    <text x="75" y="72" text-anchor="middle" class="chart-muted" font-size="11">výdaje</text>
    <text x="75" y="90" text-anchor="middle" class="chart-ink" font-size="15" font-weight="700" font-family="Bricolage Grotesque, system-ui">${tis(total)}</text></svg>`;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,raw/2)))); for(const s of [1,2,2.5,5,10]) if(s*p*2>=raw) return s*p; return 10*p; }
function lineSvg(series, opts){
  // series: [{pts:[{x,y}], color, dash, area, dot}], x domain [x0,x1]
  const W=320,H=170,L=44,R=12,T=12,B=24;
  const xs=series.flatMap(s=>s.pts.map(p=>p.x)), ys=series.flatMap(s=>s.pts.map(p=>p.y));
  const x0=opts.x0??Math.min(...xs), x1=opts.x1??Math.max(...xs);
  const lo=Math.min(0,...ys), raw=Math.max(1000,...ys)-lo; const step=niceStep(raw); const y0=lo<0?-Math.ceil(-lo/step)*step:0; const ymax=y0+step*Math.max(2,Math.ceil(raw/step));
  const x=v=>L+(x1===x0?0:(v-x0)/(x1-x0))*(W-L-R), y=v=>T+(1-(v-y0)/(ymax-y0))*(H-T-B);
  let g='';
  for(let v=y0; v<=ymax+1; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="grid-l" stroke-width="1"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" class="chart-muted">${v?tis(v):'0'}</text>`; }
  (opts.xticks||[]).forEach(([v,l])=>{ g+=`<text x="${x(v).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" class="chart-muted">${l}</text>`; });
  let s='';
  series.forEach(se=>{ if(!se.pts.length) return; const d=se.pts.map((p,i)=>(i?'L':'M')+x(p.x).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
    if(se.area && se.pts.length>1) s+=`<path d="${d} L${x(se.pts[se.pts.length-1].x).toFixed(1)} ${y(Math.max(0,y0)).toFixed(1)} L${x(se.pts[0].x).toFixed(1)} ${y(Math.max(0,y0)).toFixed(1)} Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.dash?1.6:2.4}" ${se.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>`;
    if(se.dot){ const p=se.pts[se.pts.length-1]; s+=`<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4" fill="${se.color}"/>`; } });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label||'Graf')}">${g}${s}</svg>`;
}

  const free=inc-fx-env-sink-goals;

function planGoals(){

function simCalc(){
  const avg=avgMonths(3), di=parseAmt($('#simInc').value)||0, dout=parseAmt($('#simOut').value)||0, n=Math.max(1,parseInt($('#simMonths').value)||12), once=parseAmt($('#simOnce').value)||0;

  const base=avg.inc-avg.out, nw=base+di-dout, total=nw*n-once;

}

function bindMain(){
  const m=$('#main'), on=(sel,fn)=>m.querySelectorAll(sel).forEach(b=>b.onclick=e=>fn(b,e));
  on('[data-sub]',b=>{ const [g,id]=b.dataset.sub.split(':'); S.sub[g]=id; S.imp=id==='import'?S.imp:null; render(); });
  on('[data-goto]',b=>{ const [t,s]=b.dataset.goto.split(':'); S.tab=t; S.sub[t]=s; if(b.dataset.sm) S.sumMonth=b.dataset.sm; render(); scrollTo(0,0); });
  on('[data-sm]:not([data-goto])',b=>{ S.sumMonth=b.dataset.sm; render(); });
  on('[data-act="add"]',()=>openTx());
  on('[data-act="addinc"]',()=>openTx(null,'prijem'));
  on('[data-act="seen"]',()=>{ D().lastSeen=Date.now(); save(); render(); });
  on('[data-act="exitdemo"]',()=>location.reload());
  on('[data-act="retry"]',()=>syncNow());
  on('[data-act="sharecode"]',shareCode);
  on('[data-act="backup"]',exportBackup);
  on('[data-act="logout"]',()=>{ const warn=pendingQ.size?` ${pendingQ.size} ${pl(pendingQ.size,'změna ještě nebyla odeslána','změny ještě nebyly odeslány','změn ještě nebylo odesláno')} a ztratí se.`:''; confirmSheet('Odhlásit tento telefon?',`Data z telefonu se smažou. Znovu se připojíš kódem a heslem domácnosti.${warn}`,'Odhlásit',logout); });
  const rf=$('#restoreFile'); if(rf) rf.onchange=()=>{ if(rf.files[0]) importBackup(rf.files[0]); rf.value=''; };
  on('[data-edit]',b=>{ const t=D().tx.find(t=>t.id===b.dataset.edit); if(!t) return; const rc=t.receiptId&&(D().receipts||[]).find(r=>r.id===t.receiptId); if(rc) receiptEditor(JSON.parse(JSON.stringify(rc)),true); else if(t.type==='prevod') openTransfer(t); else if(t.type==='vyrovnani') openSettleEdit(t); else openTx(t); });
  on('[data-act="receipt"]',()=>openReceipt());
  on('[data-dep]',b=>{ const [c,id]=b.dataset.dep.split(':'); openDeposit(c,D()[c].find(x=>x.id===id)); });
  on('[data-goal]',b=>openGoal(D().goals.find(g=>g.id===b.dataset.goal)));
  on('[data-act="newgoal"]',()=>openGoal());
  on('[data-sink]',b=>openSink(D().sinking.find(s=>s.id===b.dataset.sink)));
  on('[data-act="newsink"]',()=>openSink());
  on('[data-acc]',b=>openAcc(D().accounts.find(a=>a.id===b.dataset.acc)));
  on('[data-act="newacc"]',()=>openAcc());
  on('[data-act="writefix"]',writeFixed);
  on('[data-act="newfix"]',()=>openFixed());
  on('[data-fix]',b=>openFixed(D().fixed.find(f=>f.id===b.dataset.fix)));
  on('[data-pay]',b=>{ b.disabled=true; confirmPay(D().fixed.find(f=>f.id===b.dataset.pay)); });
  on('[data-act="settle"]',()=>{ S.tab='vice'; S.sub.vice='vyrovnani'; render(); scrollTo(0,0); });
  on('[data-act="dosettle"]',doSettle);
  on('[data-tag]',b=>{ S.filter={q:'#'+b.dataset.tag,type:'vse',cat:'',who:'',acc:''}; S.tab='pohyby'; render(); scrollTo(0,0); });
  on('[data-act="saveenv"]',()=>{ const l={}; EXP.forEach(c=>{ const v=parseAmt($('#lim-'+c.id).value); if(v>0) l[c.id]=Math.round(v); }); D().settings.limits=l; save(); toast('Obálky uloženy'); render(); });
  on('[data-act="envavg"]',()=>{ const fixBy={}; D().fixed.forEach(f=>fixBy[f.cat]=(fixBy[f.cat]||0)+f.amount); EXP.forEach(c=>{ let s=0; for(let i=1;i<=3;i++) s+=(monthStats(shiftM(mkey(today()),-i)).byCat[c.id]||0)/3; const v=Math.round(Math.max(0,s-(fixBy[c.id]||0))/100)*100; $('#lim-'+c.id).value=v>0?v:''; }); toast('Vyplněno podle průměru. Uprav a ulož.'); });
  on('[data-act="freetogoal"]',()=>{ const g=D().goals[0]; if(g) openDeposit('goals',g); });
  on('[data-act="savenames"]',()=>{ D().settings.nameA=$('#nameA').value.trim()||'Filip'; D().settings.nameB=$('#nameB').value.trim()||'Baruška'; save(); toast('Uloženo'); render(); });
  on('[data-act="impcancel"]',()=>{ S.imp=null; render(); });
  on('[data-act="impdo"]',doImport);
  m.querySelectorAll('[data-imp]').forEach(c=>c.onchange=()=>{ S.imp.rows[+c.dataset.imp].on=c.checked; const b=m.querySelector('[data-act="impdo"]'); const n=S.imp.rows.filter(r=>r.on).length; if(b){ b.textContent='Importovat '+n; b.disabled=!n; } });
  const fi=$('#impFile'); if(fi) fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; readCsvFile(f).then(txt=>{ S.imp=parseBank(txt,$('#impWho').value,($('#impAcc')&&$('#impAcc').value)||null); render(); }); };
  const cc=$('#copyCsv'); if(cc) cc.onclick=copyCsv;
  const fq=$('#fq'); if(fq) fq.oninput=()=>{ S.filter.q=fq.value; render(); };
  m.querySelectorAll('#fType button').forEach(b=>b.onclick=()=>{ S.filter.type=b.dataset.v; render(); });
  const fc=$('#fCat'); if(fc) fc.onchange=()=>{ S.filter.cat=fc.value; render(); };
  const fw=$('#fWho'); if(fw) fw.onchange=()=>{ S.filter.who=fw.value; render(); };
  const fa=$('#fAcc'); if(fa) fa.onchange=()=>{ S.filter.acc=fa.value; render(); };
  on('[data-act="transfer"]',()=>openTransfer());
  m.querySelectorAll('#meSeg button').forEach(b=>b.onclick=()=>setMe(b.dataset.v));
  if($('#simInc')){ ['simInc','simOut','simMonths','simOnce'].forEach(id=>$('#'+id).oninput=simCalc); simCalc();
    m.querySelectorAll('#simPresets button').forEach(b=>b.onclick=()=>{ const avg=avgMonths(3); const P={rodicovska:[-Math.round(avg.inc*0.4/1000)*1000,2500,12,15000],hypoteka:[0,6000,24,0],auto:[0,1500,36,150000],vyplata:[8000,0,12,0]}[b.dataset.p];
      [$('#simInc').value,$('#simOut').value,$('#simMonths').value,$('#simOnce').value]=P.map(String); simCalc(); }); }
}

/* ================= sheets ================= */
function closeSheet(){ $('#sheetRoot').innerHTML=''; }
function sheet(title, body, noClose){
  $('#sheetRoot').innerHTML=`<div class="sheet-wrap" id="sw"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grip"></div><h3>${esc(title)}${noClose?'':'<button id="closeS" aria-label="Zavřít">✕</button>'}</h3>${body}</div></div>`;
  if(!noClose){ $('#closeS').onclick=closeSheet; $('#sw').addEventListener('click',e=>{ if(e.target.id==='sw') closeSheet(); }); }
}
function confirmSheet(title,text,okLabel,fn){
  sheet(title,`<p class="p">${esc(text)}</p><div class="foot"><button class="btn ghost" id="cNo">Zpět</button><button class="btn danger" id="cYes">${esc(okLabel)}</button></div>`);
  $('#cNo').onclick=closeSheet; $('#cYes').onclick=()=>{ closeSheet(); fn(); };
}
function upsert(col,obj){ const arr=D()[col]; const i=arr.findIndex(x=>x.id===obj.id); if(i>=0) arr[i]=obj; else arr.push(obj); save(); }
function delItem(col,id){ D()[col]=D()[col].filter(x=>x.id!==id); save(); }
function delConfirm(holder,text,fn){ $(holder).innerHTML=`<div class="confirm"><span>${esc(text)}</span><div class="foot"><button class="btn ghost" data-no>Ponechat</button><button class="btn danger" data-yes>Smazat</button></div></div>`; $(holder).querySelector('[data-no]').onclick=()=>$(holder).innerHTML=''; $(holder).querySelector('[data-yes]').onclick=()=>{ closeSheet(); fn(); }; }

function recentNotes(cat){ const seen=new Map(); [...D().tx].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(t=>{ if(t.cat===cat&&t.note&&!t.fixedId&&!seen.has(t.note)) seen.set(t.note,t.amount); }); return [...seen.entries()].slice(0,4); }

function openTx(t, presetType){
  const isNew=!t, N=names(), lastCat=ls.get('rb-lastcat');
  const st={ type:t?.type||presetType||'vydaj', cat:t?.cat||(presetType==='prijem'?'vyplata':(lastCat&&EXP.some(c=>c.id===lastCat)?lastCat:'jidlo')), who:t?.who||(presetType==='prijem'&&S.me?S.me:'spol'), manual:!isNew, shared:!!t?.shared };
  const draw=()=>{
    const cats=st.type==='prijem'?INC:EXP; if(!cats.find(c=>c.id===st.cat)) st.cat=cats[0].id;
    $('#catChips').innerHTML=cats.map(c=>`<button data-cat="${c.id}" aria-pressed="${c.id===st.cat}"><i class="dot" style="background:${c.c}"></i>${c.n}</button>`).join('');
    $('#catChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.cat=b.dataset.cat; st.manual=true; $('#smart').textContent=''; draw(); });
    $$('#typeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.type));
    $$('#whoSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.who));
    $('#shareRow').hidden = !(st.type==='vydaj' && (st.who==='a'||st.who==='b'));
    const sg=recentNotes(st.cat);
    $('#sugg').innerHTML=isNew&&sg.length?sg.map(([n,a],i)=>`<button data-i="${i}">${esc(n)} · ${tis(a)}</button>`).join(''):'';
    $('#sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const [n,a]=sg[+b.dataset.i]; $('#txNote').value=n; if(!$('#txAmt').value) $('#txAmt').value=a; });
  };
  const defDate=t?t.date:(mkey(today())===S.month?today():S.month+'-01');
  sheet(isNew?(st.type==='prijem'?'Nový příjem':'Nový pohyb'):'Upravit pohyb',`
    ${isNew?`<div class="receipt"><span>Nákup z obchodu? Vyfoť účtenku a appka ji rozdělí na jídlo, drogerii a další.</span><button class="btn sm" id="rcOpen" type="button">Účtenka</button></div>`:''}
    <div class="seg" id="typeSeg"><button data-v="vydaj">Výdaj</button><button data-v="prijem">Příjem</button></div>
    <div class="amount-in"><input id="txAmt" inputmode="decimal" placeholder="0" value="${t?t.amount:''}" aria-label="Částka"><span>Kč</span></div>
    <div class="field"><label for="txNote">Kde / co</label><input id="txNote" placeholder="např. Lidl, Shell, kavárna" value="${esc(t?.note||'')}" autocomplete="off"></div>
    <div class="smart" id="smart"></div>
    <div class="sugg" id="sugg"></div>
    <span class="lbl">Kategorie</span><div class="chips" id="catChips"></div>
    <span class="lbl">Kdo platil</span>
    <div class="seg three" id="whoSeg" style="margin-top:6px"><button data-v="a">${esc(N.a)}</button><button data-v="b">${esc(N.b)}</button><button data-v="spol">Společné</button></div>
    <label class="checkrow" id="shareRow"><input type="checkbox" id="txShared" ${st.shared?'checked':''}> Dělíme napůl (zaplaceno ze svého)</label>
    ${D().accounts.length?`<div class="field"><label for="txAcc">${st.type==='prijem'?'Na účet':'Z účtu'}</label><select id="txAcc"><option value="">Neuvedeno</option>${accOpts(t?(t.account||''):defAcc())}</select></div>`:''}
    <div class="grid2"><div class="field"><label for="txDate">Datum</label><input id="txDate" type="date" value="${defDate}"></div><div class="field"><label for="txTags">Štítky</label><input id="txTags" placeholder="dovolená, oslava" value="${esc((t?.tags||[]).join(', '))}"></div></div>
    <div class="field"><label for="txComment">Komentář pro ${esc(S.me==='a'?'Barušku':S.me==='b'?N.a:'druhého')}</label><input id="txComment" placeholder="nepovinné" value="${esc(t?.comment||'')}"></div>
    ${t&&t.by?`<p class="muted" style="font-size:.82rem;margin:-4px 0 12px">Naposledy ${(t.changedAt||0)>(t.createdAt||0)+2000?'upravil':'zapsal'}${fem(N[t.by])?'a':''} ${esc(N[t.by]||'')}${t.changedAt?', '+new Date(t.changedAt).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):''}.</p>`:''}
    <div class="foot">${isNew?'':'<button class="btn danger" id="txDel">Smazat</button><button class="btn ghost" id="txDup">Znovu dnes</button>'}<button class="btn" id="txSave">${isNew?'Zapsat':'Uložit'}</button></div>
    <div id="delConfirm"></div>`);
  $$('#typeSeg button').forEach(b=>b.onclick=()=>{ st.type=b.dataset.v; draw(); });
  $$('#whoSeg button').forEach(b=>b.onclick=()=>{ st.who=b.dataset.v; draw(); });
  $('#txNote').oninput=()=>{ if(st.manual||st.type!=='vydaj') return; const g=guessCat($('#txNote').value); if(g&&g.cat!==st.cat){ st.cat=g.cat; draw(); } $('#smart').textContent=g?`Kategorie ${CAT[g.cat].n.toLowerCase()} ${g.why}`:''; };
  const rco=$('#rcOpen'); if(rco) rco.onclick=()=>openReceipt();
  draw();
  if(isNew) setTimeout(()=>$('#txAmt')?.focus(),60);
  const collect=()=>{ const amount=parseAmt($('#txAmt').value); if(!(amount>0)){ toast('Zadej částku větší než nula.'); $('#txAmt').focus(); return null; }
    const tags=$('#txTags').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
    return {date:$('#txDate').value||today(),amount:Math.round(amount*100)/100,type:st.type,cat:st.cat,who:st.who,note:$('#txNote').value.trim(),tags,comment:$('#txComment').value.trim(),shared:st.type==='vydaj'&&(st.who==='a'||st.who==='b')&&$('#txShared').checked,account:($('#txAcc')&&$('#txAcc').value)||null}; };
  $('#txSave').onclick=()=>{ const base=collect(); if(!base) return; const now=Date.now();
    const rec={id:t?.id||uid('t'),...base,createdAt:t?.createdAt||now,changedAt:now,by:S.me||t?.by||null}; if(t?.fixedId) rec.fixedId=t.fixedId;
    if(st.type==='vydaj') ls.set('rb-lastcat',st.cat); if(rec.account&&isNew) ls.set('rb-acc-'+(S.me||'x'),rec.account);
    upsert('tx',rec); closeSheet(); S.month=mkey(rec.date); toast(isNew?'Zapsáno':'Uloženo'); render(); };
  const dup=$('#txDup'); if(dup) dup.onclick=()=>{ const base=collect(); if(!base) return; const now=Date.now(); upsert('tx',{id:uid('t'),...base,date:today(),createdAt:now,changedAt:now,by:S.me||null}); closeSheet(); S.month=mkey(today()); toast('Zapsáno znovu na dnešek'); render(); };
  const del=$('#txDel'); if(del) del.onclick=()=>delConfirm('#delConfirm','Opravdu smazat tenhle pohyb?',()=>{ delItem('tx',t.id); toast('Smazáno'); render(); });
}

function openReceipt(){
  const mode={v:'text'};
  sheet('Účtenka z obchodu',`
    ${S.sampleOk?`<div class="seg" id="rcMode"><button data-v="text" aria-pressed="true">Text z fotky · zdarma</button><button data-v="ai" aria-pressed="false">Fotka přes Claude</button></div>`:''}
    <div id="rcText">
      <ol class="steps" style="margin-bottom:12px"><li>Vyfoť účtenku Fotoaparátem. Dlouhou klidně na víc fotek.</li><li>Otevři fotku ve Fotkách a klepni na ikonu Živého textu vpravo dole (rámeček s řádky).</li><li>Zvol zkopírování všeho textu a vlož ho sem. U víc fotek vkládej postupně pod sebe.</li></ol>

    catch(e){ pick.style.pointerEvents=''; pick.style.opacity=''; fi.value='';
      $('#rcStatus').textContent = e&&e.code==='empty' ? 'Na fotce jsem nenašel položky. Zkus ostřejší fotku celé účtenky.' : e&&e.code==='not_granted' ? 'Čtení účtenek není povolené.' : e&&e.code==='rate_limited' ? 'Teď je toho moc najednou, zkus to za chvíli.' : 'Účtenku se nepodařilo přečíst. Zkus to znovu.'; } };

function receiptEditor(rc, existing){
  const N=names();
  const opts=c=>EXP.map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${x.n}</option>`).join('');
  sheet(existing?'Účtenka '+rc.store:'Zkontroluj účtenku',`
    ${rc.nLearned?`<p class="smart" style="margin:-6px 0 6px">${rc.nLearned} ${pl(rc.nLearned,'položku','položky','položek')} jsem zařadil podle toho, jak jste je třídili dřív.</p>`:''}${rc.nUnsure?`<p class="smart" style="margin:-2px 0 10px;color:var(--warn)">U ${rc.nUnsure} ${pl(rc.nUnsure,'položky','položek','položek')} jsem si nebyl jistý a dal jsem ${pl(rc.nUnsure,'ji','je','je')} do jídla. ${pl(rc.nUnsure,'Je označená, zkontroluj ji.','Jsou označené, zkontroluj je.','Jsou označené, zkontroluj je.')}</p>`:''}
    <div class="grid2"><div class="field"><label for="rcStore">Obchod</label><input id="rcStore" value="${esc(rc.store)}"></div><div class="field"><label for="rcDate">Datum</label><input id="rcDate" type="date" value="${rc.date}"></div></div>
    <div class="field"><label for="rcTotal">Celkem zaplaceno (Kč)</label><input id="rcTotal" inputmode="decimal" value="${rc.total}"></div>
    <div class="stack" id="rcStack"></div><div class="rc-sum" id="rcSum"></div>
    <span class="lbl" style="display:block;margin-top:14px">Položky (${rc.items.length}) · kategorii změníš u každé zvlášť</span>
    <div class="rc-items" id="rcItems"></div>
    <span class="lbl">Kdo platil</span>
    <div class="seg three" id="rcWho" style="margin-top:6px"><button data-v="a">${esc(N.a)}</button><button data-v="b">${esc(N.b)}</button><button data-v="spol">Společné</button></div>
    ${D().accounts.length?`<div class="field mt"><label for="rcAcc">Zaplaceno z účtu</label><select id="rcAcc"><option value="">Neuvedeno</option>${accOpts(existing?(rc.account||''):defAcc())}</select></div>`:''}
    <div class="foot">${existing?'<button class="btn danger" id="rcDel">Smazat účtenku</button>':''}<button class="btn" id="rcSave">${existing?'Uložit':'Uložit rozdělení'}</button></div><div id="rcConfirm"></div>`);
  const drawItems=()=>{ $('#rcItems').innerHTML=rc.items.map((it,i)=>`<div class="rc-item ${it.learned?'learned':''}"><span class="nm">${esc(it.name)}${it.learned?'<small>naučeno</small>':it.unsure?'<small style="color:var(--warn)">zkontroluj</small>':''}</span><select data-ri="${i}" aria-label="Kategorie ${esc(it.name)}">${opts(it.cat)}</select><input data-rp="${i}" inputmode="decimal" value="${it.price}" aria-label="Cena ${esc(it.name)}"><button data-rx="${i}" aria-label="Odebrat ${esc(it.name)}" type="button">✕</button></div>`).join('');
    $$('#rcItems [data-ri]').forEach(el=>el.onchange=()=>{ const it=rc.items[+el.dataset.ri]; it.cat=el.value; it.ai=it.unsure?'?':it.ai; drawSum(); });
    $$('#rcItems [data-rp]').forEach(el=>el.oninput=()=>{ const v=parseAmt(el.value); if(v>=0){ rc.items[+el.dataset.rp].price=r2(v); drawSum(); } });
    $$('#rcItems [data-rx]').forEach(el=>el.onclick=()=>{ rc.items.splice(+el.dataset.rx,1); drawItems(); drawSum(); }); };
  const drawSum=()=>{ const by={}; rc.items.forEach(it=>by[it.cat]=(by[it.cat]||0)+it.price); const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    const sum=r2(rows.reduce((a,r)=>a+r[1],0)), tot=parseAmt($('#rcTotal').value)||sum, diff=r2(tot-sum);
    $('#rcStack').innerHTML=rows.map(([c,a])=>`<i style="width:${sum?a/sum*100:0}%;background:${(CAT[c]||CAT.ostatni).c}"></i>`).join('');
    $('#rcSum').innerHTML=rows.map(([c,a])=>`<div><span><i class="dot" style="background:${(CAT[c]||CAT.ostatni).c}"></i>${(CAT[c]||CAT.ostatni).n}</span><b class="num">${kc(a)}</b></div>`).join('')+
      (Math.abs(diff)>=0.5?`<div style="color:var(--warn)"><span>${diff>0?'Nepřiřazeno':'Položky jsou o tolik víc'} (přičte se k největší kategorii)</span><b class="num">${kc(diff)}</b></div>`:''); };
  const st={who:rc.who||'spol'}; const drawWho=()=>$$('#rcWho button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.who));
  $$('#rcWho button').forEach(b=>b.onclick=()=>{ st.who=b.dataset.v; drawWho(); });
  $('#rcTotal').oninput=drawSum;
  drawItems(); drawSum(); drawWho();
  $('#rcSave').onclick=()=>{ if(!rc.items.length){ toast('Účtenka nemá žádné položky.'); return; }
    const total=parseAmt($('#rcTotal').value); rc.total=total>0?r2(total):r2(rc.items.reduce((a,i)=>a+i.price,0));
    rc.store=$('#rcStore').value.trim()||'Účtenka'; rc.date=$('#rcDate').value||today(); rc.who=st.who; rc.account=($('#rcAcc')&&$('#rcAcc').value)||null;
    const ic=D().itemCats=D().itemCats||{}; rc.items.forEach(it=>{ const k=itemKey(it.name); if(!k) return; if(it.cat!==it.ai||ic[k]) ic[k]=it.cat; });
    const {nLearned,nUnsure,...clean}=rc; clean.items=rc.items.map(({learned,unsure,...i})=>i);
    saveReceipt(clean); closeSheet(); S.month=mkey(clean.date);
    const n=new Set(clean.items.map(i=>i.cat)).size; toast(`Účtenka uložena, ${n} ${pl(n,'kategorie','kategorie','kategorií')}`); render(); };
  const del=$('#rcDel'); if(del) del.onclick=()=>delConfirm('#rcConfirm',`Smazat celou účtenku ${rc.store} (${kc(rc.total)})?`,()=>{ D().tx=D().tx.filter(t=>t.receiptId!==rc.id); delItem('receipts',rc.id); toast('Účtenka smazána'); render(); });
}

function fixTx(k,f,date){ const now=Date.now(), base={id:fixTxId(k,f),date,amount:+f.amount,note:f.name,fixedId:f.id,who:f.who||'spol',createdAt:now,changedAt:now,by:S.me||null};
  return f.toAccount ? {...base,type:'prevod',cat:'prevod',from:f.account||null,to:f.toAccount} : {...base,type:'vydaj',cat:f.cat,account:f.account||null}; }
async function confirmPay(f){ const k=mkey(today()); upsert('tx',fixTx(k,f,dueDate(k,f))); toast(`${f.name}: ${f.toAccount?'převedeno':'strženo'} a zapsáno`); render(); }
function writeFixed(){ const k=S.month, pend=fixedSorted().filter(f=>!fixDone(k,f)); if(!pend.length) return; const now=Date.now(), date=mkey(today())===k?today():k+'-01';
  pend.forEach(f=>upsert('tx',fixTx(k,f,f.day?dueDate(k,f):date))); toast(`Zapsáno ${pend.length} ${pl(pend.length,'platba','platby','plateb')}`); render(); }

}
function openTransfer(t){
  const acc=D().accounts.filter(a=>a.kind!=='dluh'); if(acc.length<2){ toast('Nejdřív přidej aspoň dva účty v Plán → Účty.'); return; }
  const fromDef=t?.from||ls.get('rb-trfrom')||acc[0].id, toDef=t?.to||ls.get('rb-trto')||acc[1].id;
  sheet(t?'Upravit převod':'Převod mezi účty',`<p class="p">Převod mezi vlastními účty se nepočítá do příjmů ani výdajů. Jen posune peníze a upraví zůstatky.</p>
    <div class="amount-in"><input id="trAmt" inputmode="decimal" placeholder="0" value="${t?t.amount:''}" aria-label="Částka"><span>Kč</span></div>
    <div class="grid2"><div class="field"><label for="trFrom">Z účtu</label><select id="trFrom">${accOpts(fromDef)}</select></div><div class="field"><label for="trTo">Na účet</label><select id="trTo">${accOpts(toDef)}</select></div></div>
    <div class="grid2"><div class="field"><label for="trDate">Datum</label><input id="trDate" type="date" value="${t?t.date:today()}"></div><div class="field"><label for="trNote">Poznámka</label><input id="trNote" placeholder="nepovinné" value="${esc(t?.note||'')}"></div></div>
    <div class="foot">${t?'<button class="btn danger" id="trDel">Smazat</button>':''}<button class="btn" id="trSave">${t?'Uložit':'Zapsat převod'}</button></div><div id="trConfirm"></div>`);
  if(!t) setTimeout(()=>$('#trAmt')?.focus(),60);
  $('#trSave').onclick=()=>{ const amount=parseAmt($('#trAmt').value), from=$('#trFrom').value, to=$('#trTo').value;
    if(!(amount>0)){toast('Zadej částku.');return;} if(from===to){toast('Vyber dva různé účty.');return;}
    ls.set('rb-trfrom',from); ls.set('rb-trto',to); const now=Date.now();
    upsert('tx',{...(t||{}),id:t?.id||uid('p'),type:'prevod',cat:'prevod',who:'spol',from,to,amount:Math.round(amount*100)/100,date:$('#trDate').value||today(),note:$('#trNote').value.trim(),createdAt:t?.createdAt||now,changedAt:now,by:S.me||t?.by||null});
    closeSheet(); toast(t?'Uloženo':'Převod zapsán'); render(); };
  const del=$('#trDel'); if(del) del.onclick=()=>delConfirm('#trConfirm','Smazat tento převod?',()=>{ delItem('tx',t.id); render(); });
}
function doSettle(){ const owed=settlement(), N=names(); if(Math.abs(owed)<1) return; const from=owed>0?'b':'a', to=owed>0?'a':'b';
  confirmSheet('Zapsat vyrovnání?',`${N[from]} pošle ${N[to]} ${kc(Math.abs(owed))}. Stav se tím vynuluje.`,'Zapsat',()=>{ const now=Date.now(); upsert('tx',{id:uid('v'),type:'vyrovnani',cat:'vyrovnani',date:today(),amount:Math.abs(owed),from,to,who:from,createdAt:now,changedAt:now,by:S.me||null}); toast('Vyrovnáno'); render(); }); }
function openSettleEdit(t){ const N=names(); sheet('Vyrovnání',`<p class="p">${esc(N[t.from])} → ${esc(N[t.to])}: ${kc(t.amount)}, ${new Date(t.date+'T12:00').toLocaleDateString('cs-CZ')}</p><div class="foot"><button class="btn danger" id="vDel">Smazat vyrovnání</button></div><div id="vConfirm"></div>`); $('#vDel').onclick=()=>delConfirm('#vConfirm','Smazat toto vyrovnání?',()=>{ delItem('tx',t.id); render(); }); }

/* ================= import CSV ================= */
function readCsvFile(f){ return f.arrayBuffer().then(buf=>{ let txt=new TextDecoder('utf-8').decode(buf); if(txt.includes('\uFFFD')){ try{ txt=new TextDecoder('windows-1250').decode(buf); }catch(e){} } return txt; }); }
function splitCsv(line,d){ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const c=line[i]; if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else if(c==='"') q=true; else if(c===d){ out.push(cur); cur=''; } else cur+=c; } out.push(cur); return out.map(s=>s.trim()); }
function parseDate(s){ s=(s||'').trim(); let m=s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/); if(m) return m[3]+'-'+pad(m[2])+'-'+pad(m[1]); m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3]; return null; }
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); };
function parseBank(txt,who,accId){
  const lines=txt.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  let hi=-1, d=';';
  for(let i=0;i<Math.min(lines.length,40);i++){ const l=lines[i].toLowerCase(); if(l.includes('datum')&&(l.includes('objem')||l.includes('částka')||l.includes('castka')||l.includes('amount'))){ hi=i; d=(lines[i].split(';').length>=lines[i].split(',').length)?';':','; break; } }
  if(hi<0) return {rows:[],dupes:0,err:'Nepoznal jsem formát. Potřebuju CSV se sloupci Datum a Objem nebo Částka.'};
  const head=splitCsv(lines[hi],d).map(h=>h.toLowerCase().replace(/"/g,''));
  const find=(...keys)=>{ for(const k of keys){ const i=head.findIndex(h=>h===k); if(i>=0) return i; } for(const k of keys){ const i=head.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
  const iDate=find('datum provedení','datum'), iAmt=find('objem','zaúčtovaná částka','částka','castka','amount');
  const iNotes=[find('název protiúčtu','nazev protiuctu'),find('zpráva pro příjemce'),find('poznámka','poznamka'),find('zpráva','zprava'),find('obchodník','místo'),find('popis')].filter(i=>i>=0);
  const iCp=find('protiúčet','číslo protiúčtu','protiucet','cislo protiuctu','účet protistrany');
  const digits=x=>String(x||'').split('/')[0].replace(/\D/g,'').replace(/^0+/,'');
  const own={}; D().accounts.forEach(a=>{ const dg=digits(a.number); if(dg) own[dg]=a.id; });
  const existing=new Set(D().tx.map(t=>t.importId).filter(Boolean)); let dupes=0; const rows=[];
  const fixUsed=new Set();
  for(let i=hi+1;i<lines.length;i++){
    const c=splitCsv(lines[i],d); const date=parseDate(c[iDate]); const amt=parseAmt((c[iAmt]||'').replace(/[^\d,.\-−]/g,'').replace('−','-'));
    if(!date||!isFinite(amt)||!amt) continue;
    const note=[...new Set(iNotes.map(j=>c[j]).filter(Boolean))].slice(0,2).join(' · ').slice(0,80);
    const cpAcc=iCp>=0?own[digits(c[iCp])]:null;
    if(accId && cpAcc && cpAcc!==accId){ const from=amt<0?accId:cpAcc, to=amt<0?cpAcc:accId, importId='imp-tr-'+hash(date+'|'+Math.abs(amt)+'|'+[from,to].join('>'));
      if(existing.has(importId)){ dupes++; continue; } existing.add(importId);
      const ff=D().fixed.find(f=>f.toAccount===to&&Math.abs(f.amount-Math.abs(amt))<0.5&&!fixDone(mkey(date),f));
      rows.push({date,amount:Math.abs(amt),type:'prevod',cat:'prevod',from,to,note:note||'Převod',importId,who:'spol',fixedId:ff?ff.id:null,on:true}); continue; }
    const importId='imp-'+hash(date+'|'+amt+'|'+note);
    if(existing.has(importId)){ dupes++; continue; } existing.add(importId);
    const type=amt>0?'prijem':'vydaj', amount=Math.abs(amt);
    let cat=type==='prijem'?(amount>15000?'vyplata':'prijem-ostatni'):((guessCat(note)||{}).cat||'ostatni');
    let fixedId=null; if(type==='vydaj'){ const f=D().fixed.find(f=>!fixUsed.has(f.id+mkey(date))&&Math.abs(f.amount-amount)<0.5&&!fixDone(mkey(date),f)); if(f){ fixedId=f.id; cat=f.cat; fixUsed.add(f.id+mkey(date)); } }
    rows.push({date,amount,type,cat,note,importId,fixedId,who,account:accId,on:true});
  }
  return {rows,dupes};
}
function doImport(){ const now=Date.now(); const sel=S.imp.rows.filter(r=>r.on); sel.forEach(r=>{ const {on,...rest}=r; const rec={id:r.fixedId?fixTxId(mkey(r.date),{id:r.fixedId}):uid('t'),...rest,note:rest.note||'',createdAt:now,changedAt:now,by:S.me||null}; if(!rec.fixedId) delete rec.fixedId; upsert('tx',rec); }); save(); toast(`Importováno ${sel.length} ${pl(sel.length,'pohyb','pohyby','pohybů')}`); S.imp=null; render(); }

async function copyCsv(){ const N=names(); const rows=[['datum','typ','kategorie','kdo','castka','poznamka','stitky','komentar']];
  [...D().tx].filter(isTx).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type==='prijem'?'příjem':'výdaj',(CAT[t.cat]||{}).n||t.cat,N[t.who]||t.who,String(t.amount).replace('.',','),t.note||'',(t.tags||[]).join(' '),t.comment||'']));
  const csv=rows.map(r=>r.map(x=>/[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(';')).join('\n');
  try{ await navigator.clipboard.writeText(csv); toast('CSV zkopírováno'); } catch(e){ const ta=$('#csvOut'); ta.hidden=false; ta.value=csv; ta.focus(); ta.select(); toast('Označeno, zkopíruj ručně'); } }

let toastT;
function toast(msg){ $('#toastRoot').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>$('#toastRoot').innerHTML='',3200); }

/* ================= identita ================= */
function askWhoAmI(){ const N=names();
  sheet('Kdo používá tenhle telefon?',`<p class="p">Appka pak druhému ukáže, co jsi nového zapsal. Změnit to jde ve Více → Nastavení.</p><div class="whoami"><button class="btn" data-me="a">${esc(N.a)}</button><button class="btn" data-me="b">${esc(N.b)}</button></div>`,true);
  $$('[data-me]').forEach(b=>b.onclick=()=>{ setMe(b.dataset.me); closeSheet(); }); }
function setMe(p){ S.me=p; ls.set('rb-me',p); render(); }

/* ================= start ================= */
async function start(){
  S.me=ls.get('rb-me');
  try{ if(CFG.url&&CFG.key&&window.supabase) sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'rb-auth'}}); }catch(e){ sb=null; }
  let hh=null; try{ hh=JSON.parse(ls.get('rb-hh')||'null'); }catch(e){}
  const key=hh?await idbGet('key'):null, token=hh?await idbGet('token'):null;
  if(!sb||!hh||!key){ showOnboarding(); return; }
  S.hh=hh; S.key=key; S.token=token;
  if(!await loadCache()){ S.D=emptyData(); synced={}; lastSync=null; }
  render(); if(!S.me) setTimeout(askWhoAmI,500);
  await syncNow();
  setInterval(()=>{ if(!document.hidden) syncNow(); },60000);
}
window.addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncNow(); });
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
$('#prevM').onclick=()=>{ S.month=shiftM(S.month,-1); render(); };
$('#nextM').onclick=()=>{ S.month=shiftM(S.month,1); render(); };
$('#fab').onclick=()=>{ if(S.tab==='plan'&&S.sub.plan==='cile') openGoal(); else if(S.tab==='plan'&&S.sub.plan==='velke') openSink(); else if(S.tab==='plan'&&S.sub.plan==='jmeni') openAcc(); else if(S.tab==='fixy') openFixed(); else openTx(); };
$$('nav.tabs button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); scrollTo(0,0); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('.whoami')) closeSheet(); });
start();
})();
